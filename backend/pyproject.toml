[project]
name = "cutline-backend"
version = "0.1.0"
description = "Deterministic defensive agent incident replay demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "pytest>=9.0.3,<10",
  "httpx2>=2.9,<3",
]

[project.optional-dependencies]
langfuse = ["langfuse==4.14.2"]
modal = ["modal>=1.0"]
overmind = ["overmind>=0.1.55,<0.2"]
supabase = ["supabase>=2.15"]
all = [
  "langfuse==4.14.2",
  "modal>=1.0",
  "overmind>=0.1.55,<0.2",
  "supabase>=2.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
